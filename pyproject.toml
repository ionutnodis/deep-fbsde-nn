[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-fbsde-nn"
version = "0.1.0"
description = "Neural network solvers for high-dimensional FBSDEs and PDEs in quantitative finance"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Ionut Nodis"}
]
keywords = [
    "FBSDE",
    "BSDE",
    "PDE",
    "neural-networks",
    "deep-learning",
    "option-pricing",
    "quantitative-finance",
    "pytorch"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "pytest-cov",
    "ruff",
]
viz = [
    "tensorboard>=2.12.0",
]

[project.urls]
Repository = "https://github.com/nodisionut/deep-fbsde-nn"

[tool.setuptools.packages.find]
where = ["."]
include = ["deep_fbsde_nn*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

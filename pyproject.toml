[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-fbsde-nn"
version = "0.1.0"
description = "Neural network solvers for high-dimensional FBSDEs and PDEs in quantitative finance"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Ionut Nodis"}
]
keywords = [
    "FBSDE",
    "BSDE",
    "PDE",
    "neural-networks",
    "deep-learning",
    "option-pricing",
    "quantitative-finance",
    "pytorch",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Office/Business :: Financial",
]

# Core stays lean on purpose: the installed package imports only torch and numpy.
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
# For running the experiments/ scripts from a source checkout.
# The wheel does not contain experiments/ — this extra exists for git clones.
experiments = [
    "matplotlib>=3.7.0",
    "scipy>=1.10.0",
]
dev = [
    "pytest>=7.3.0",
    "pytest-cov",
    "ruff",
    "build",
    "twine",
]

[project.urls]
Repository = "https://github.com/ionutnodis/deep-fbsde-nn"

[tool.setuptools.packages.find]
where = ["."]
include = ["deep_fbsde_nn*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Experiment scripts bootstrap sys.path before importing the package.
"experiments/**" = ["E402"]
# tables.py bootstraps sys.path and uses an import as an availability probe.
"tables.py" = ["E402", "F401"]
# jupytext percent-format notebook source: imports live in their own cells.
"examples/quickstart_notebook.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "slow: long-running convergence tests (run in CI on tag and weekly)",
]

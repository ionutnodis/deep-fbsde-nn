# Compiles the JOSS paper draft (paper.md + paper.bib) exactly as the journal
# does, per their pre-submission checklist. Runs on demand and whenever the
# paper changes; the compiled PDF is downloadable from the run's artifacts.
name: JOSS draft PDF

on:
  workflow_dispatch:
  push:
    paths: ["paper.md", "paper.bib"]

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build draft PDF
        # pinned to a commit SHA (mutable @master is a supply-chain risk); was master on 2026-09-05
        uses: openjournals/openjournals-draft-action@85a18372e48f551d8af9ddb7a747de685fbbb01c
        with:
          journal: joss
          paper-path: paper.md
      - uses: actions/upload-artifact@v4
        with:
          name: paper
          path: paper.pdf
